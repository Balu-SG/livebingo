<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>LiveBingo Card</title>
  <link rel="stylesheet" href="/card.css">
  <script src="/card.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> LiveBingo <span id="channel-name"></span></div>
      <span id="round-status" class="round-status">Loading round…</span>
    </header>
    <section class="card-panel" aria-labelledby="viewer-name">
      <div class="heading">
        <div>
          <p class="eyebrow">YOUR STREAM CARD</p>
          <h1 id="viewer-name">Loading your card…</h1>
        </div>
        <span class="live-dot" aria-label="Live round"></span>
      </div>
      <p id="marked-progress" class="marked-progress">0/24 squares</p>
      <div id="bingo-banner" class="bingo-banner" role="status" hidden>
        <span class="banner-sparkle" aria-hidden="true">✦</span>
        <span>BINGO!</span>
        <span id="winner-rank" class="winner-rank"></span>
      </div>
      <div id="bingo-grid" class="bingo-grid" role="grid" aria-label="Your 5 by 5 bingo card"></div>
      <details class="how-it-works"><summary>How it works</summary><p>Squares mark automatically when they happen on stream. Get five in a row, column, or diagonal to win. Type <strong>!bingo</strong> in chat to join a new round.</p></details>
      <p id="error-message" class="error-message" role="alert" hidden></p>
    </section>
    <footer>Made for the moments chat remembers.</footer>
  </main>
</body>
</html>
